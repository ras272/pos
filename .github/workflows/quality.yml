name: quality

on:
  push:
    branches: [main]
  pull_request:

# Ningún job de este repositorio escribe en GitHub. El token es de solo
# lectura para que un paquete comprometido no pueda empujar código.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    # Valores de relleno, no secretos: la clave publicable de Supabase está
    # pensada para viajar al navegador y acá solo sirven para que el build
    # tenga orígenes exactos con los que armar las CSP.
    env:
      ADMIN_ORIGIN: https://admin.example.com
      CAJA_ORIGIN: https://caja.example.com
      NEXT_PUBLIC_API_URL: https://api.example.com
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci-placeholder
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      VITE_API_URL: https://api.example.com
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci-placeholder
      VITE_SUPABASE_URL: https://example.supabase.co
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Límites de arquitectura, entrypoints sin guardia, variables de entorno,
      # tamaño de módulo, seguridad de workflows y escaneo de secretos. El
      # escáner reporta archivo y línea, nunca el valor encontrado.
      - name: Security gates
        run: pnpm security

      - name: Builds
        run: pnpm build

      - name: Dependency audit
        run: pnpm audit --audit-level high

  workflows:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
